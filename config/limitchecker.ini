;;Last Price Tolerance price precedence
lpt_xsession1=last
lpt_xsession2=last
lpt_xsession3=last

;; Ignore missing price in price tolerance checks
invalid_close_price_action=ignore
invalid_last_price_action=ignore
invalid_bbo_price_action=ignore

[PXFeeder]
;; Refresh interval in seconds for subscribed symbols (default: 300 = 5 min)
refresh_interval = 300
;; Maximum symbols to track before oldest non-active ones are evicted
max_symbols = 100
